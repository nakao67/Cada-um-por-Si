<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Cada Um Por Si</title>
<style>
:root { color-scheme: dark; --red:#ff201d; --white:#f7f7f7; }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; background:#000; color:var(--white); font-family:Arial, Helvetica, sans-serif; }
body { min-height:100vh; }
button, a { -webkit-tap-highlight-color:transparent; }
#app { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 18px 30px; }
header { width:100%; display:flex; justify-content:center; padding:clamp(24px, 9vh, 90px) 0 34px; }
.logo { display:flex; align-items:center; justify-content:center; gap:8px; max-width:100%; white-space:nowrap; font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size:clamp(25px, 6.6vw, 58px); letter-spacing:-1.7px; line-height:1; text-transform:uppercase; }
.logo-image { display:block; width:min(100%, 720px); height:auto; object-fit:contain; } .logo .white { color:#fff; }
.logo .red { color:var(--red); }
.menu { display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; margin-top:auto; margin-bottom:auto; padding:10px 0 38px; }
.menu-btn { width:min(82vw, 310px); min-height:66px; border:2px solid #fff; border-radius:var(--button-radius, 16px); background:#000; color:#fff; font-size:19px; font-weight:800; letter-spacing:1.2px; cursor:pointer; transition:background .15s, color .15s, transform .15s; }
.menu-btn:active { transform:scale(.98); background:#fff; color:#000; }
.page { display:none; width:min(100%, 760px); padding:18px 0 35px; }
.page.active { display:block; animation:appear .18s ease-out; }
@keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.page-top { display:flex; justify-content:flex-end; margin-bottom:14px; }
.close { border:0; background:transparent; color:var(--red); font-size:43px; font-weight:900; line-height:1; cursor:pointer; padding:0 5px; }
h1 { text-align:center; font-size:28px; margin:0 0 25px; letter-spacing:1px; }
.about-text { text-align:center; font-size:18px; line-height:1.65; max-width:590px; margin:50px auto; }
.white-screen { min-height:58vh; background:#000; color:#fff; border:1px solid #222; border-radius:2px; display:flex; align-items:center; justify-content:center; text-align:center; padding:25px; font-size:24px; font-weight:700; }
.credits-title { margin-bottom:22px; }
.people { display:grid; grid-template-columns:repeat(auto-fit, minmax(145px, 1fr)); gap:12px; }
.person { display:flex; align-items:center; gap:11px; min-width:0; padding:12px; border:1px solid #333; border-radius:13px; background:#090909; color:#fff; text-decoration:none; transition:border-color .15s, background .15s; }
.person:hover, .person:focus-visible { border-color:#fff; background:#151515; }
.avatar { width:47px; height:47px; flex:0 0 47px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#242424; border:1px solid #777; color:#fff; font-weight:800; font-size:15px; overflow:hidden; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.person-name { font-size:13px; font-weight:800; overflow-wrap:anywhere; }
.person-handle { display:block; color:#aaa; font-size:11px; margin-top:4px; font-weight:400; }
.note { color:#999; font-size:12px; text-align:center; margin:18px 0 0; line-height:1.5; }
footer { color:#555; font-size:11px; padding-top:12px; }
.public-posts { display:grid; gap:14px; }
.post-card { border:1px solid #333; border-radius:14px; padding:16px; background:#090909; overflow-wrap:anywhere; }
.post-card h2 { margin:0 0 8px; font-size:20px; text-align:left; }
.post-card p { line-height:1.55; white-space:pre-wrap; }
.post-card img { width:100%; max-height:360px; object-fit:contain; border-radius:9px; margin-top:10px; background:#111; }
.post-date { display:block; color:#888; font-size:12px; margin-top:12px; }
.post-card a { color:#fff; text-decoration:underline; overflow-wrap:anywhere; }
.menu-btn:focus-visible { outline:2px solid var(--red); outline-offset:4px; }
@media (max-width:380px) { .logo { gap:5px; letter-spacing:-1.3px; } .people { grid-template-columns:1fr 1fr; gap:8px; } .person { padding:9px; gap:8px; } .avatar { width:39px; height:39px; flex-basis:39px; } .person-name { font-size:12px; } }
</style>
</head>

const list = document.getElementById("people");

const menu = document.getElementById("menu");
const header = document.getElementById("homeHeader");
const footer = document.getElementById("footer");
function showPage(id) {
  menu.style.display = "none";
  header.style.display = "none";
  footer.style.display = "none";
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === id));
  window.scrollTo({top:0, behavior:"smooth"});
}
function showHome() {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  menu.style.display = "flex";
  header.style.display = "flex";
  footer.style.display = "block";
  window.scrollTo({top:0, behavior:"smooth"});
}

let audioCtx;
function playClickSound() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(620, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(390, audioCtx.currentTime + 0.055);
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.075);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  } catch (e) {}
}

document.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => { playClickSound(); showPage(b.dataset.page); }));
document.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", showHome));
document.addEventListener("keydown", e => { if (e.key === "Escape") showHome(); });
